# for downscaling nodes

apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: roboshop
  region: us-east-1

managedNodeGroups:
  - name: spot
    instanceTypes:
      - t3.small
      - t3a.small
      - t2.small
    spot: true
    minSize: 0
    desiredCapacity: 2
    maxSize: 2